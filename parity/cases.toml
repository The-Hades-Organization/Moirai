# Matriz de paridade do Moirai: `hades moirai ...` (TS, Hades-Skill) contra o binário `moirai`.
# O argv é o do binário; o lado TS ganha o subcomando `moirai` por `ts_cmd`.
# Casos que dependem do relógio ficam `pending` até o Hades-Skill do CI ler `HADES_NOW` (PR #151).

[[case]]
id = "uso.sem-sub"
argv = []
ts_cmd = ["{skill}/src/cli.ts", "moirai"]
env = { HADES_NOW = "2026-11-20T12:00:00Z" }
compare = ["stdout", "exit"]

[[case]]
id = "uso.help"
argv = ["-h"]
ts_cmd = ["{skill}/src/cli.ts", "moirai"]
env = { HADES_NOW = "2026-11-20T12:00:00Z" }
compare = ["stdout", "exit"]

[[case]]
id = "uso.help-longo"
