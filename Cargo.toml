[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/The-Hades-Organization/Moirai"

[workspace.dependencies]
hades-core = { git = "https://github.com/The-Hades-Organization/Hades-Core", tag = "v0.2.0" }
regex = "1"
clap = { version = "4", features = ["derive"] }
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", default-features = false, features = ["wayland", "x11"] }
gpui-component = "=0.9.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.dev.package."*"]
opt-level = 2
